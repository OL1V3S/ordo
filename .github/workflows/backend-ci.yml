name: Backend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Build backend
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: >-
          dotnet test backend.Tests/backend.Tests.csproj
          --configuration Release
          --no-restore
          --filter "Category!=PostgreSQL"

      - name: Publish backend with contained PDF worker
        run: dotnet publish backend/backend.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/backend-publish"

      - name: Verify contained PDF worker artifact
        shell: bash
        run: |
          worker="$RUNNER_TEMP/backend-publish/PdfWorker/backend.PdfWorker"
          test -x "$worker"
          test -f "$RUNNER_TEMP/backend-publish/PdfWorker/backend.PdfWorker.deps.json"
          test -f "$RUNNER_TEMP/backend-publish/PdfWorker/backend.PdfWorker.runtimeconfig.json"
          find "$RUNNER_TEMP/backend-publish/PdfWorker" -maxdepth 1 -name 'UglyToad.PdfPig*.dll' -print -quit | grep -q .
          DOTNET_GCHeapHardLimit=8000000 "$worker" </dev/null >"$RUNNER_TEMP/worker-smoke.bin"
          test "$(wc -c <"$RUNNER_TEMP/worker-smoke.bin")" -eq 6

      - name: Build production backend image
        run: docker build --file backend/Dockerfile --tag ordo-backend:ci .

      - name: Verify production backend image
        shell: bash
        run: |
          docker image inspect ordo-backend:ci \
            --format '{{json .Config.Entrypoint}}' \
            | grep -Fx '["dotnet","backend.dll"]'

          docker run --rm --entrypoint sh ordo-backend:ci -c '
            test -f /app/backend.dll
            test -x /app/PdfWorker/backend.PdfWorker
            test -f /app/PdfWorker/backend.PdfWorker.deps.json
            test -f /app/PdfWorker/backend.PdfWorker.runtimeconfig.json
            find /app/PdfWorker -maxdepth 1 -name "UglyToad.PdfPig*.dll" -print -quit | grep -q .
            DOTNET_GCHeapHardLimit=8000000 /app/PdfWorker/backend.PdfWorker </dev/null >/tmp/worker-smoke.bin
            test "$(wc -c </tmp/worker-smoke.bin)" -eq 6
          '

          container_id=$(docker run --detach --publish 127.0.0.1::8080 \
            --env 'ConnectionStrings__DefaultConnection=Host=127.0.0.1;Database=unused;Username=unused;Password=unused;Timeout=1' \
            --env 'Jwt__Key=ci-only-jwt-key-with-at-least-thirty-two-bytes' \
            --env 'EmailSettings__FromName=Ordo CI' \
            --env 'EmailSettings__FromEmail=ci@example.invalid' \
            --env 'GoogleEmail__ClientId=ci-only' \
            --env 'GoogleEmail__ClientSecret=ci-only' \
            --env 'GoogleEmail__RefreshToken=ci-only' \
            --env 'Frontend__BaseUrl=https://example.invalid' \
            --env 'Logging__LogLevel__Microsoft.EntityFrameworkCore=Critical' \
            --env 'Logging__LogLevel__Microsoft.AspNetCore.DataProtection=Critical' \
            ordo-backend:ci)

          cleanup() {
            docker logs "$container_id"
            docker rm --force "$container_id" >/dev/null
          }
          trap cleanup EXIT

          started=false
          for attempt in {1..10}; do
            test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = true
            if docker exec "$container_id" sh -c \
              'grep -Eq ":1F90 .* 0A " /proc/net/tcp /proc/net/tcp6'; then
              started=true
              break
            fi
            sleep 1
          done

          test "$started" = true
          docker exec "$container_id" sh -c \
            'tr "\000" " " </proc/1/cmdline | grep -Fx "dotnet backend.dll "'

  postgresql-integration:
    name: PostgreSQL financial integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: budget_planner_ci
          POSTGRES_USER: budget_planner_ci
          POSTGRES_PASSWORD: budget_planner_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_planner_ci -d budget_planner_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUDGETPLANNER_POSTGRESQL_TEST_CONNECTION: >-
        Host=localhost;Port=5432;Database=budget_planner_ci;Username=budget_planner_ci;Password=budget_planner_ci_only;Pooling=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Build PostgreSQL integration tests
        run: dotnet build backend.Tests/backend.Tests.csproj --configuration Release --no-restore

      - name: Verify migration chain on empty PostgreSQL
        run: >-
          dotnet test backend.Tests/backend.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=PostgreSQL&FullyQualifiedName~Migration_chain"

      - name: Run PostgreSQL financial integration tests
        run: >-
          dotnet test backend.Tests/backend.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=PostgreSQL&FullyQualifiedName!~Migration_chain"
