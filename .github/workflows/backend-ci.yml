name: Backend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Verify harness scripts
        run: ./scripts/verify-script-tests.sh

      - name: Verify backend
        run: ./scripts/verify.sh backend

      - name: Verify production backend image
        run: ./scripts/verify.sh container

  postgresql-integration:
    name: PostgreSQL financial integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: budget_planner_ci
          POSTGRES_USER: budget_planner_ci
          POSTGRES_PASSWORD: budget_planner_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_planner_ci -d budget_planner_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUDGETPLANNER_POSTGRESQL_TEST_CONNECTION: >-
        Host=localhost;Port=5432;Database=budget_planner_ci;Username=budget_planner_ci;Password=budget_planner_ci_only;Pooling=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Verify PostgreSQL integration
        run: ./scripts/verify.sh postgresql
