name: iOS CI

# Non-required check: builds and tests the native iOS app. It is deliberately not part of the
# "Protect Main" ruleset, so its failure does not block unrelated changes, but a failing
# "iOS build and tests" run is a blocking review finding for pull requests that touch ios/**.
on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    # Pinned image: macOS with Xcode 27 (preview image; see actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in data[runtime]:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          ')"
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # Code signing stays at the default (sign to run locally): the Keychain tests need the
        # simulator entitlement, which CODE_SIGNING_ALLOWED=NO would remove (error -34018).
        run: |
          xcodebuild \
            -project ios/Ordo.xcodeproj \
            -scheme Ordo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/Ordo.xcresult" \
            test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/Ordo.xcresult
          if-no-files-found: ignore
          retention-days: 7
